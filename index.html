<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">

  <title>Qui mange où ?</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #111827;
      --accent2: #eef2ff;
      --ok: #067647;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
    }

    main {
      width: min(720px, calc(100% - 28px));
      margin: 32px auto 48px;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .head {
      margin-bottom: 20px;
    }

    .head h1 {
      font-size: 28px;
    }

    .head p {
      color: var(--muted);
      margin-top: 6px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      margin-top: 16px;
    }

    label.title {
      display: block;
      font-weight: 650;
      margin-bottom: 8px;
    }

    .name {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 16px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .choices.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .choice {
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .choice:has(input:checked) {
      border-color: #111827;
      background: var(--accent2);
      font-weight: 650;
    }

    .choice input {
      position: absolute;
      opacity: 0;
    }

    .field {
      margin-top: 18px;
    }

    .disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 16px;
      background: var(--accent);
      color: white;
      font-weight: 650;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-top: 18px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .msg {
      font-size: 14px;
      margin-top: 10px;
      min-height: 20px;
    }

    .ok {
      color: var(--ok);
    }

    .err {
      color: var(--danger);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 14px;
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 25px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .people {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 10px;
    }

    .person {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .person-name {
      font-size: 14px;
      font-weight: 550;
    }

    .person-info {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .rowhead {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 560px) {
      main {
        margin-top: 20px;
      }

      .choices.three {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .stat:last-child {
        grid-column: 1 / -1;
      }

      .person {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<main>

  <header class="head">

    <div id="identityBox" style="margin-bottom:16px">
  <div class="muted">
    Ton nom
  </div>

  <input
    class="name"
    id="localName"
    maxlength="40"
    autocomplete="name"
    placeholder="Ex. Thomas"
    required
  >
  </div>
    
    <h1>🍴 Qui mange où ?</h1>
    <p id="dateLine">Déjeuner du jour</p>
  </header>


  <!-- FORMULAIRE -->
  <section class="card">

    <form id="form">

      


      <div class="field">

        <label class="title">
          Tu manges ce midi ?
        </label>

        <div class="choices">

          <label class="choice">
            <input
              type="radio"
              name="eats"
              value="yes"
              required
            >
            🍽️ Oui
          </label>

          <label class="choice">
            <input
              type="radio"
              name="eats"
              value="no"
            >
            🏠 Non
          </label>

        </div>
      </div>


      <div class="field" id="restaurantWrap">

        <label class="title">
          Où tu manges ?
        </label>

        <div class="choices three">

          <label class="choice">
            <input
              type="radio"
              name="restaurant"
              value="Comptoir 41"
            >
            Comptoir 41
          </label>

          <label class="choice">
            <input
              type="radio"
              name="restaurant"
              value="4G"
            >
            4G
          </label>

          <label class="choice">
            <input
              type="radio"
              name="restaurant"
              value="Divina"
            >
            Divina
          </label>

        </div>
      </div>


      <button
        id="saveBtn"
        type="submit"
      >
        Enregistrer ma réponse
      </button>

      <div
        id="message"
        class="msg"
        aria-live="polite"
      ></div>

    </form>

  </section>


  <!-- RÉCAPITULATIF -->
  <section class="card">

    <div class="rowhead">

      <div>
        <h2>Récapitulatif</h2>

        <div
          class="muted"
          id="liveStatus"
        >
          Chargement…
        </div>
      </div>

    </div>


    <!-- COMPTEURS -->
    <div class="summary">

      <div class="stat">
        <b id="c41">0</b>
        <span>Comptoir 41</span>
      </div>

      <div class="stat">
        <b id="g4">0</b>
        <span>4G</span>
      </div>

      <div class="stat">
        <b id="divina">0</b>
        <span>Divina</span>
      </div>

    </div>


    <!-- PERSONNES QUI MANGENT -->
    <div style="margin-top:20px">

      <h3>
        Personnes qui mangent
      </h3>

      <div
        class="people"
        id="eaters"
      >
        <span class="muted">
          Aucune réponse.
        </span>
      </div>

    </div>


    <!-- PERSONNES QUI NE MANGENT PAS -->
    <div style="margin-top:18px">

      <h3>
        Ne mangent pas
      </h3>

      <div
        class="people"
        id="notEaters"
      >
        <span class="muted">
          Aucune réponse.
        </span>
      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

(() => {

  /*
   * ============================================================
   * SUPABASE
   * ============================================================
   */

  const SUPABASE_URL =
    "https://adpvmvyyelspuhkzphby.supabase.co";

  /*
   * Remets ici TA CLÉ SUPABASE ACTUELLE.
   * Ne mets surtout pas une clé service_role.
   */
  const SUPABASE_KEY =
    "sb_publishable_kSQ75fw7wAVUcfBuqYsu7Q_DaTqFGeV";


  /*
   * ============================================================
   * ÉLÉMENTS DE LA PAGE
   * ============================================================
   */

  const form =
    document.querySelector("#form");

  const nameInput =
    document.querySelector("#name");

  const restaurantWrap =
    document.querySelector("#restaurantWrap");

  const saveBtn =
    document.querySelector("#saveBtn");

  const message =
    document.querySelector("#message");

  const liveStatus =
    document.querySelector("#liveStatus");

  const dateLine =
    document.querySelector("#dateLine");


  /*
   * ============================================================
   * DATE DU JOUR
   * ============================================================
   */

  function today() {

  const d = new Date();

  return `${d.getFullYear()}-${String(
    d.getMonth() + 1
  ).padStart(2, "0")}-${String(
    d.getDate()
  ).padStart(2, "0")}`;

  }


  /*
   * ============================================================
   * DATE AFFICHÉE
   * ============================================================
   */

  function frenchDate() {

    return new Intl.DateTimeFormat(
      "fr-FR",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    ).format(new Date());

  }


  dateLine.textContent =
    `Déjeuner du ${frenchDate()}`;


  /*
   * ============================================================
   * CONNEXION SUPABASE
   * ============================================================
   */

  const {
    createClient
  } = window.supabase;

  const db =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
    /*
 * ============================================================
 * IDENTITÉ LOCALE
 * ============================================================
 */

function getLocalUserId() {

  let userId =
    localStorage.getItem("dejeuner_user_id");

  if (!userId) {

    userId =
      crypto.randomUUID();

    localStorage.setItem(
      "dejeuner_user_id",
      userId
    );

  }

  return userId;
}


function getLocalName() {

  return localStorage.getItem(
    "dejeuner_name"
  ) || "";

}


const localNameInput =
  document.querySelector("#localName");


localNameInput.value =
  getLocalName();


localNameInput.addEventListener(
  "input",
  () => {

    localStorage.setItem(
      "dejeuner_name",
      localNameInput.value.trim()
    );

  }
);


  /*
   * ============================================================
   * DONNÉES
   * ============================================================
   */

  let rows = [];


  /*
   * ============================================================
   * PROTECTION HTML
   * ============================================================
   */

  function esc(value) {

    return String(value).replace(
      /[&<>"']/g,
      c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c])
    );

  }


  /*
   * ============================================================
   * FORMATAGE DE L'HEURE
   * ============================================================
   */

  function formatTime(dateString) {

    if (!dateString) {
      return "";
    }

    return new Intl.DateTimeFormat(
      "fr-FR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(new Date(dateString));

  }


  /*
   * ============================================================
   * AFFICHAGE
   * ============================================================
   */

  function render() {

    const eaters =
      rows.filter(r => r.eats);

    const no =
      rows.filter(r => !r.eats);


    function count(restaurant) {

      return eaters.filter(
        r => r.restaurant === restaurant
      ).length;

    }


    document.querySelector("#c41").textContent =
      count("Comptoir 41");

    document.querySelector("#g4").textContent =
      count("4G");

    document.querySelector("#divina").textContent =
      count("Divina");


    /*
     * Personnes qui mangent
     */

    document.querySelector("#eaters").innerHTML =
      eaters.length

        ? eaters
            .map(
              r => `
                <div class="person">

                  <div class="person-name">
                    ${esc(r.name)}
                  </div>

                  <div class="person-info">
                    ${esc(r.restaurant)}
                    · ${formatTime(r.updated_at)}
                  </div>

                </div>
              `
            )
            .join("")

        : '<span class="muted">Aucune réponse.</span>';


    /*
     * Personnes qui ne mangent pas
     */

    document.querySelector("#notEaters").innerHTML =
      no.length

        ? no
            .map(
              r => `
                <div class="person">

                  <div class="person-name">
                    ${esc(r.name)}
                  </div>

                  <div class="person-info">
                    ${formatTime(r.updated_at)}
                  </div>

                </div>
              `
            )
            .join("")

        : '<span class="muted">Aucune réponse.</span>';


    /*
     * Statut
     */

    liveStatus.textContent =
      `${rows.length} réponse${
        rows.length > 1 ? "s" : ""
      } · mise à jour en direct`;

  }


  /*
   * ============================================================
   * CHARGEMENT
   * ============================================================
   */

  async function load() {

    const {
      data,
      error
    } = await db
      .from("lunch_responses")
      .select(
        "id,user_id,name,eats,restaurant,lunch_date,created_at,updated_at"
      )  
      .eq(
        "lunch_date",
        today()
      )
      .order(
        "updated_at",
        {
          ascending: true
        }
      );


    if (error) {

      liveStatus.textContent =
        "Erreur de connexion à la base";

      message.textContent =
        error.message;

      message.className =
        "msg err";

      return;

    }


    rows =
      data || [];


    render();

    restoreMine();

  }


  /*
   * ============================================================
   * RETROUVER MA RÉPONSE
   * ============================================================
   */

  function restoreMine() {

  const userId =
    getLocalUserId();

  const mine =
    rows.find(
      r => r.user_id === userId
    );

  if (!mine) {
    return;
  }

  const eatsRadio =
    document.querySelector(
      `input[name="eats"][value="${
        mine.eats ? "yes" : "no"
      }"]`
    );

  if (eatsRadio) {
    eatsRadio.checked = true;
  }

  if (mine.restaurant) {

    document
      .querySelectorAll(
        'input[name="restaurant"]'
      )
      .forEach(input => {

        input.checked =
          input.value === mine.restaurant;

      });

  }

  updateRestaurantState();

}



  /*
   * ============================================================
   * ENREGISTREMENT / MODIFICATION
   * ============================================================
   */

    async function save(e) {

  e.preventDefault();

  const userId =
    getLocalUserId();

  const name =
    localNameInput.value.trim();


  /*
   * Vérifications
   */

  if (!name) {

    message.textContent =
      "Indique ton nom.";

    message.className =
      "msg err";

    localNameInput.focus();

    return;
  }


  const eatsValue =
    document.querySelector(
      'input[name="eats"]:checked'
    )?.value;


  const restaurant =
    document.querySelector(
      'input[name="restaurant"]:checked'
    )?.value || null;


  if (!eatsValue) {

    message.textContent =
      "Indique si tu manges ce midi.";

    message.className =
      "msg err";

    return;
  }


  if (
    eatsValue === "yes" &&
    !restaurant
  ) {

    message.textContent =
      "Choisis un restaurant.";

    message.className =
      "msg err";

    return;
  }


  saveBtn.disabled = true;

  message.textContent =
    "Enregistrement…";

  message.className =
    "msg";


  const payload = {

    lunch_date:
      today(),

    user_id:
      userId,

    name:
      name,

    eats:
      eatsValue === "yes",

    restaurant:
      eatsValue === "yes"
        ? restaurant
        : null,

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } = await db
    .from("lunch_responses")
    .upsert(
      payload,
      {
        onConflict:
          "lunch_date,user_id"
      }
    );


  saveBtn.disabled = false;


  if (error) {

    message.textContent =
      error.message;

    message.className =
      "msg err";

    return;
  }


  localStorage.setItem(
    "dejeuner_name",
    name
  );


  message.textContent =
    "Réponse enregistrée ✓";

  message.className =
    "msg ok";


  await load();

}


  /*
   * ============================================================
   * GESTION OUI / NON
   * ============================================================
   */

  function updateRestaurantState() {

    const yes =
      document.querySelector(
        'input[name="eats"][value="yes"]'
      )?.checked;


    restaurantWrap.classList.toggle(
      "disabled",
      !yes
    );


    document
      .querySelectorAll(
        'input[name="restaurant"]'
      )
      .forEach(input => {

        input.disabled = !yes;

        if (!yes) {
          input.checked = false;
        }

      });

  }


  document
    .querySelectorAll(
      'input[name="eats"]'
    )
    .forEach(input => {

      input.addEventListener(
        "change",
        updateRestaurantState
      );

    });


  /*
   * ============================================================
   * FORMULAIRE
   * ============================================================
   */

  form.addEventListener(
    "submit",
    save
  );


  /*
   * ============================================================
   * TEMPS RÉEL
   * ============================================================
   */

  db
    .channel("lunch-live")

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "lunch_responses"
      },
      payload => {

        const newDate =
          payload.new?.lunch_date;

        const oldDate =
          payload.old?.lunch_date;


        if (
          newDate === today() ||
          oldDate === today()
        ) {

          load();

        }

      }
    )

    .subscribe();


  /*
   * ============================================================
   * INITIALISATION
   * ============================================================
   */

  updateRestaurantState();

load();

})();

</script>

</body>
</html>
